<title id="ft">Figure 3 — Manipulation alert by detector and the adv4 rule validation</title>
<desc id="fd">Alert hits on the 30 manipulated messages (solid bar, per-set breakdown) and false alarms on the 30 honest ones (hatched bar); manipulation ≥ 0.5 = alert; ten of each class per set, no inferential CI. Reference: never alerting scores 30/60 with no false alarms. Lower panel: the three pre-registered regexes are validated on adv4 only (0/10 hits, 3/10 false alarms; never alerting there scores 10/20). Alert counts are invariant under GT v4. GT v5 · data cut v2.10.0</desc>
