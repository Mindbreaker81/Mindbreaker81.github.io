<title id="ft">Figure 6 — Pre-registered contrasts and department primacy</title>
<desc id="fd">Top panel: paired adjusted delta (B−A) with per-contrast CI (cluster bootstrap over ES/EN/PMID): thinking on−off in probabilities (97.5% CI) and discrete (98.75% CI), discrete−probabilities with thinking (98.75% CI), and MedGemma vs Gemma 3 and Qwen (97.5% CI). Bottom panel: bronchoscopy primacy in error percentage points (95% CI, n=37), local FP8 Qwen and Microsoft-Decision-1 (confirmatory). The per-row threshold is each contrast's pre-registered one: +5 for the gain hypotheses, −5 for MedGemma–Qwen non-inferiority, +5 pp for primacy. 0 = no difference. GT v5 · data cut v2.10.0</desc>
